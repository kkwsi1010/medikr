name: 빌드 실패 AI 자동수정

# Build & Deploy 가 자동 재실행까지 실패하면 Claude 가 원인을 읽고 코드를 고친다.
#
# 손대지 않는 경우 (고칠 코드가 없는 실패):
#   로그에 '예외 fetch failed' : 식약처 API 네트워크 단절. 기다리면 풀린다
#   로그에 code=30/31/32       : API 키 미등록·만료·IP 제한. 사람만 해결 가능
#   직전 커밋이 autofix 산물   : 자기 수정을 다시 고치는 무한루프 차단
#
# 안전장치:
#   1. Claude 는 파일 편집만 한다. git·배포·시크릿은 만지지 않는다
#   2. 손대면 안 되는 경로를 고쳤으면 푸시하지 않고 Issue 로 올린다
#   3. 실제 빌드(식약처 수집 + astro build)가 통과해야만 main 에 푸시한다
#
# PR 로만 받고 싶으면 '검증 통과시 main 에 푸시' 스텝의 git push 를
# 브랜치 푸시 + gh pr create 로 바꾸면 된다.

on:
  workflow_run:
    workflows: ['Build & Deploy']
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  autofix:
    # 1차 실패는 복구 워크플로우가 30분 뒤 재실행한다. 그것까지 실패한 뒤에만 개입한다.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - name: 실패 로그 수집 및 개입 여부 판단
        id: triage
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[0].id')
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > failure-full.log 2>/dev/null || true
          # 로그가 크면 뒤쪽만 쓴다. 실패 원인은 항상 끝부분에 있다.
          tail -c 40000 failure-full.log > failure.log
          echo "로그 $(wc -c < failure.log) bytes"

          SKIP=""
          if [ "$HAS_KEY" != "true" ]; then
            SKIP="ANTHROPIC_API_KEY 시크릿이 없다. Settings > Secrets 에 추가해야 동작한다"
          elif grep -q '예외 fetch failed' failure.log; then
            SKIP="식약처 API 네트워크 단절 (외부 장애). 고칠 코드가 없다"
          elif grep -qE 'code=(30|31|32)' failure.log; then
            SKIP="식약처 API 키 문제 (미등록·만료·IP제한). 사람이 갱신해야 한다"
          elif git log -1 --pretty=%s | grep -q '\[autofix\]'; then
            SKIP="직전 커밋이 autofix 산물. 무한루프 차단"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ -n "$SKIP" ]; then echo "개입 안 함: $SKIP"; else echo "개입한다"; fi

      - name: Setup Node
        if: steps.triage.outputs.skip == ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 의존성 설치
        if: steps.triage.outputs.skip == ''
        run: npm install --no-audit --no-fund

      # claude-code-action 대신 헤드리스 CLI 를 쓴다.
      # 액션은 issue·PR 이벤트를 전제로 모드를 자동 판별하고 workflow_dispatch 는
      # 문서에 'coming soon' 으로 적혀 있어 workflow_run 에서 도는지 보장이 없다.
      # CLI 는 이벤트와 무관하게 돌고, git 과 배포는 아래 스텝이 기계적으로 처리한다.
      - name: Claude Code 설치
        if: steps.triage.outputs.skip == ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude 가 원인 분석 후 수정
        if: steps.triage.outputs.skip == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          medikr.kr 의 GitHub Actions 빌드가 실패했다. 원인을 찾아 코드를 고쳐라.

          실패 로그는 저장소 루트의 failure.log 에 있다. 먼저 그것을 읽어라.
          빌드 명령은 package.json 의 build 이고, tsx scripts/build-index.ts 로
          식약처 OpenAPI 를 수집해 색인과 D1 seed 를 만든 뒤 astro build 를 한다.

          반드시 지켜라.

          1. 절대 고치지 마라. 하나라도 건드리면 이 작업은 실패로 처리된다.
             scripts/build-index.ts 의 MIN_SIZE 값과 process.exit(1) 게이트.
             이것은 식약처 데이터가 비었을 때 빈 사이트맵과 빈 D1 캐시가
             배포되는 것을 막는 안전장치다. 빌드를 통과시키려고 기준을
             낮추거나 게이트를 지우는 것은 사고를 다시 일으키는 짓이다.
             그리고 .github/ 아래 모든 파일, migrations/ 아래 모든 파일,
             tests/ 를 지우거나 비활성화하는 변경도 금지다.

          2. 원인이 아래 중 하나라면 아무것도 고치지 말고 그 사실만 보고하라.
             식약처 API 네트워크 단절이나 응답 지연.
             API 키 만료, 호출한도 초과, IP 제한.
             Cloudflare 나 GitHub 인프라 장애.
             고칠 코드가 없는 실패에 코드를 고치면 없던 문제가 생긴다.

          3. 고칠 때는 최소 단위로 고쳐라. 원인과 직접 연결되지 않는 줄은
             한 줄도 바꾸지 마라. 리팩터링, 주석 정리, 포맷 변경 금지.

          4. 되돌리기 어려운 비직관적 코드를 넣었다면 왜 그렇게 했는지
             코드 옆에 주석으로 남겨라.

          5. 긴 대시 문자를 코드 주석과 문서에 쓰지 마라. 문장을 끊거나
             괄호나 쉼표로 대신하라.

          6. 검증은 타입 검사와 구문 검사까지만 하라. npm run build 는
             실행할 수 없다. 식약처 API 키가 이 단계에 없기 때문이다.
             실제 빌드 검증은 다음 스텝이 한다.

          마지막에 autofix-summary.txt 파일을 만들어 다음 두 줄을 써라.
          첫 줄: 원인 한 문장
          둘째 줄: 한 일 한 문장. 고치지 않았으면 '수정 없음' 이라고 써라.
          PROMPT

          # --bare : 러너의 훅·플러그인·CLAUDE.md 를 안 읽어 실행이 재현 가능해진다
          # --permission-mode dontAsk : allowedTools 에 없는 것은 전부 거부
          # 시크릿을 이 단계에 주지 않으므로 실제 빌드는 못 한다. 타입·구문 검사까지만.
          claude --bare -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --permission-mode dontAsk \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npx tsc *),Bash(npx astro check *),Bash(node --check *),Bash(node --experimental-strip-types *),Bash(cat *),Bash(ls *),Bash(grep *)" \
            --output-format json > "$RUNNER_TEMP/claude-out.json"

          echo "### Claude 판단" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.result' "$RUNNER_TEMP/claude-out.json" >> "$GITHUB_STEP_SUMMARY"
          echo "비용 USD $(jq -r '.total_cost_usd // "?"' "$RUNNER_TEMP/claude-out.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: 손대면 안 되는 경로를 고쳤는지 검사
        if: steps.triage.outputs.skip == ''
        id: forbidden
        run: |
          rm -f failure.log failure-full.log
          # autofix-summary.txt 는 Claude 의 보고용이라 커밋 대상이 아니다.
          # 푸시 스텝에서 지우는데, 목록에 남아 있으면 git add 가 pathspec 오류로 죽는다.
          CHANGED=$(git status --porcelain | awk '{print $NF}' | grep -v '^autofix-summary\.txt$' || true)
          echo "변경된 파일:"; echo "$CHANGED"
          # 뒤의 검증 빌드가 src/data 색인 JSON 수 MB 를 새로 만든다.
          # 그때 git add -A 로 담으면 그 산출물까지 커밋된다.
          # 그래서 지금(빌드 전) 목록을 떠서 나중에 이것만 커밋한다.
          printf '%s\n' "$CHANGED" > "$RUNNER_TEMP/changed.txt"
          BAD=$(echo "$CHANGED" | grep -E '^(\.github/|migrations/|tests/)' || true)
          if [ -n "$BAD" ]; then
            echo "금지 경로 변경 감지"; echo "$BAD"
            echo "bad=$BAD" >> "$GITHUB_OUTPUT"
          fi
          # 안전장치 자체가 약해졌는지 확인한다.
          if ! grep -q 'permits: 20000' scripts/build-index.ts; then
            echo "guard=MIN_SIZE 가 변경됨" >> "$GITHUB_OUTPUT"
          elif ! grep -q 'process.exit(1)' scripts/build-index.ts; then
            echo "guard=배포 차단 게이트가 사라짐" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CHANGED" ]; then echo "empty=1" >> "$GITHUB_OUTPUT"; fi

      - name: 실제 빌드로 검증
        if: >-
          steps.triage.outputs.skip == '' &&
          steps.forbidden.outputs.empty != '1' &&
          steps.forbidden.outputs.bad == '' &&
          steps.forbidden.outputs.guard == ''
        id: verify
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          PUBLIC_CACHE_VERSION: autofix-${{ github.run_id }}
        run: npm run build

      - name: 검증 통과시 main 에 푸시
        if: steps.verify.outcome == 'success'
        run: |
          SUMMARY=$(head -1 autofix-summary.txt 2>/dev/null || echo '원인 미기재')
          DID=$(sed -n '2p' autofix-summary.txt 2>/dev/null || echo '')
          rm -f autofix-summary.txt
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
          # Claude 가 고친 파일만 담는다. 검증 빌드가 만든 색인 JSON 은 제외된다.
          xargs -r git add -- < "$RUNNER_TEMP/changed.txt"
          git diff --cached --stat
          git commit -m "[autofix] $SUMMARY" -m "$DID" -m "실패한 실행: $RUN_URL"
          git push origin main
          echo "main 에 푸시 완료. Build & Deploy 가 다시 돌면서 배포된다"

      - name: 결과 보고
        if: always() && steps.triage.outputs.skip == ''
        # ${{ }} 를 run 안에 직접 박으면 값에 따옴표가 섞일 때 셸이 깨진다.
        # 값은 전부 env 로 받아 셸 변수로만 쓴다.
        env:
          BAD: ${{ steps.forbidden.outputs.bad }}
          GUARD: ${{ steps.forbidden.outputs.guard }}
          EMPTY: ${{ steps.forbidden.outputs.empty }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            printf '실패한 실행: %s\n\n' "$RUN_URL"
            if [ -n "$BAD$GUARD" ]; then
              printf '자동수정을 버렸습니다. 손대면 안 되는 곳을 고쳤습니다.\n\n'
              printf '%s\n%s\n\n' "$BAD" "$GUARD"
              printf '사람이 직접 봐야 합니다.\n'
            elif [ "$EMPTY" = "1" ]; then
              printf 'Claude 가 고칠 것이 없다고 판단했습니다. 사람이 직접 봐야 합니다.\n'
            elif [ "$VERIFY" = "success" ]; then
              printf '자동수정 성공. main 에 푸시했습니다.\n'
            else
              printf '수정했지만 검증 빌드가 통과하지 못했습니다. 푸시하지 않았습니다.\n'
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          # 사람이 봐야 하는 경우만 알린다.
          # 같은 사고로 build-failure-recovery 가 이미 ci-failure 이슈를 열었으므로
          # 새 이슈를 만들지 않고 그 이슈에 붙인다. 없을 때만 새로 만든다.
          if [ "$VERIFY" != "success" ]; then
            EXISTING=$(gh issue list --repo "$REPO" --state open --label ci-failure \
              --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body-file report.md
            else
              gh issue create --repo "$REPO" --label ci-failure \
                --title "자동수정 실패. 사람 확인 필요" --body-file report.md
            fi
          fi
