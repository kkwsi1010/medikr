name: WIF 연결 테스트 (임시)

# Workload Identity Federation 이 실제로 교환되는지 한 번 확인하는 용도.
# 확인이 끝나면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: OIDC 토큰 발급 후 교환
        run: |
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "JWT 길이 ${#JWT}"
          # sub 클레임만 확인한다. 규칙의 제목 패턴과 맞는지 보려는 것이다.
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '{sub, aud, ref, event_name, repository, repository_owner_id}' || true

          BODY=$(jq -n \
            --arg a "$JWT" \
            --arg r "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg o "$ANTHROPIC_ORGANIZATION_ID" \
            --arg s "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg w "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion:$a, federation_rule_id:$r, organization_id:$o,
              service_account_id:$s}
             + (if $w == "" then {} else {workspace_id:$w} end)')

          RESP=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" --data "$BODY")
          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "교환 실패: $(echo "$RESP" | jq -c '.')" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "교환 성공. 유효기간 $(echo "$RESP" | jq -r '.expires_in')초, 토큰 접두어 $(echo "$TOKEN" | cut -c1-14)"

          # 받은 토큰으로 실제 API 를 한 번 호출해 본다. 교환만 되고 호출이 막히면 의미가 없다.
          OUT=$(curl -sS https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5","max_tokens":16,"messages":[{"role":"user","content":"say OK"}]}')
          echo "API 응답: $(echo "$OUT" | jq -c '{type, model, stop_reason, err: .error.message}')"
          echo "$OUT" | jq -e '.content[0].text' >/dev/null || { echo "API 호출 실패" >&2; exit 1; }
          echo "API 호출까지 정상"
