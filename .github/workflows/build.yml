name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 매일 06:00 KST (21:00 UTC) — 식약처 데이터 갱신 + D1 seed 재적재 + 배포.
    # (cron.yml 의 빈커밋은 GITHUB_TOKEN push 라 이 workflow 를 트리거 못 해서 직접 schedule)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 25분이었으나 2026-08-18 실행이 17분(D1 seed 혼자 15분, 평소 13초)이라 여유가 없었다.
    # build-index 재수집(최대 7분)까지 더해지면 seed 도중 잡이 잘려 배포가 통째로 날아간다.
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 직전 성공 빌드의 색인을 복원한다.
      # 식약처 API 가 러너에서 간헐적으로 막히는데(2026-08-18 약 2분, 09-08 약 18분,
      # 09-09 60분 이상) 그때마다 배포가 통째로 멈추는 것을 막는다.
      # 수집이 성공하면 build-index 가 전부 덮어쓰므로 이 복원본은 버려진다.
      # 수집이 실패했을 때만 build-index 가 이것을 그대로 쓰고 배포로 넘어간다.
      - name: 직전 성공 색인 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            src/data
            public/sitemap.xml
            public/sitemap-drugs-*.xml
            migrations/seed-drugs.sql
          key: mfds-index-
          restore-keys: |
            mfds-index-

      - name: Astro build
        id: build
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GOOGLE_VERIFY: ${{ vars.PUBLIC_GOOGLE_VERIFY }}
          PUBLIC_NAVER_VERIFY: ${{ vars.PUBLIC_NAVER_VERIFY }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          # 광고 네트워크 — Repo Variables 에 값 넣으면 자동 반영, 없으면 렌더 안 함
          PUBLIC_ADFIT_UNIT: ${{ vars.PUBLIC_ADFIT_UNIT }}
          PUBLIC_COUPANG_ID: ${{ vars.PUBLIC_COUPANG_ID }}
          PUBLIC_COUPANG_TRACKING: ${{ vars.PUBLIC_COUPANG_TRACKING }}
          # 빌드 SHA → drug 페이지 캐시 네임스페이스. 빌드마다 새 키로 옛 캐시 응답 격리.
          PUBLIC_CACHE_VERSION: ${{ github.sha }}
        run: npm run build

      # 실패한 빌드의 산출물을 저장하면 restore-keys 접두어 매칭이 그것을 먼저
      # 집어서 멀쩡한 직전 스냅샷을 가린다. 빌드가 통과한 경우에만 저장한다.
      # key 에 run_id 를 넣어 매번 새 항목으로 저장하므로, 복원은 항상 가장
      # 최근 성공분을 집고 7일 미사용 evict 도 일어나지 않는다.
      - name: 색인 스냅샷 저장
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            src/data
            public/sitemap.xml
            public/sitemap-drugs-*.xml
            migrations/seed-drugs.sql
          key: mfds-index-${{ github.run_id }}

      - name: Upload build artifact (backup, optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

      - name: Apply D1 migrations (idempotent — CREATE IF NOT EXISTS)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute medikr-analytics --remote --file=migrations/0001_visits.sql

      - name: Apply D1 drug_cache schema
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute medikr-analytics --remote --file=migrations/0002_drug_cache.sql

      - name: Seed D1 drug_cache (build-index 가 생성한 약 상세 적재)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        # D1 이 느린 날 이 스텝이 잡 예산을 다 먹으면 뒤의 Pages 배포까지 못 한다.
        # 캐시 갱신은 하루 미뤄도 되지만 배포는 미루면 안 되므로 여기서 끊는다.
        timeout-minutes: 25
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute medikr-analytics --remote --file=migrations/seed-drugs.sql

      - name: Register D1 binding to Pages project
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          curl -X PATCH "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/medikr" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"deployment_configs":{"production":{"d1_databases":{"DB":{"id":"e5e3974c-98ae-45a0-bbaa-e37a9043dfbe"}}}}}'

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 한글 commit message → CF API Invalid UTF-8 회피: SHA + dirty 만 전달
          command: pages deploy dist --project-name=medikr --branch=main --commit-message="${{ github.sha }}"

      - name: IndexNow — 네이버/Bing 색인 알림 (주요 URL + 최근 허가약)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          KEY="4d6b9f2a8c1e7305b9d4f6a2c8e0b1d3"
          URLS=$(python3 -c "
          import json
          urls = ['https://medikr.kr/','https://medikr.kr/search/','https://medikr.kr/api/','https://medikr.kr/contact/']
          try:
            rp = json.load(open('src/data/recent-permits.json'))
            urls += ['https://medikr.kr/drug/%s/' % r['seq'] for r in rp[:30]]
          except Exception: pass
          print(json.dumps(urls))
          ")
          echo "IndexNow 제출 URL 수: $(echo "$URLS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"medikr.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://medikr.kr/$KEY.txt\",\"urlList\":$URLS}" \
            -w "IndexNow HTTP %{http_code}\n"
